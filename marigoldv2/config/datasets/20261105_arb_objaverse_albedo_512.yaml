arb_objaverse_train_albedo_512:
  name: GenericDataset
  disp_name: arb_objaverse_train_albedo_512
  sampling_weight: 1.0
  manifest_cfg:
    name: GenericManifest
    manifest_graph:
      - LoadArbObjaverseManifest:
          base_dir: ${oc.env:ARB_OBJAVERSE_DIR,${oc.env:DEPTH_ASSETS_DIR,./assets}/datasets/arb_objaverse}
          manifest: arb_objaverse_train.txt
  transform:
    - ReadArbObjaversePair:
        srgb_p: 0.5
    - RandomHorizontalFlipAlbedo:
        p: 0.5
        include_keys: [rgb_norm, rgb_int, albedo_gt, valid_mask]

arb_objaverse_val_albedo_512:
  name: GenericDataset
  disp_name: arb_objaverse_val_albedo_512
  manifest_cfg:
    name: GenericManifest
    manifest_graph:
      - LoadArbObjaverseManifest:
          base_dir: ${oc.env:ARB_OBJAVERSE_DIR,${oc.env:DEPTH_ASSETS_DIR,./assets}/datasets/arb_objaverse}
          manifest: arb_objaverse_val.txt
          verify_files: true
  transform:
    - ReadArbObjaversePair:
        srgb_p: 0.0
  validation_steps:
    - RunInference: {}
    - ComputeAlbedoMetrics:
        pred_key: out/albedo_pred
        gt_key: albedo_gt
        mask_key: valid_mask

arb_objaverse_vis_albedo_512:
  name: GenericDataset
  disp_name: arb_objaverse_vis_albedo_512
  manifest_cfg:
    name: GenericManifest
    manifest_graph:
      - LoadArbObjaverseManifest:
          base_dir: ${oc.env:ARB_OBJAVERSE_DIR,${oc.env:DEPTH_ASSETS_DIR,./assets}/datasets/arb_objaverse}
          manifest: arb_objaverse_vis.txt
          verify_files: true
  transform:
    - ReadArbObjaversePair:
        srgb_p: 0.0
  validation_steps:
    - RunInference: {}
    - VisualizeRGB:
        batch_key: rgb_norm
        folder_name: input_rgb
        file_path_key: rgb_path
        value_range: [-1, 1]
    - VisualizeRGBAlbedo:
        batch_key: albedo_gt
        mask_key: valid_mask
        folder_name: albedo_gt
        file_path_key: rgb_path
    - VisualizeRGBAlbedo:
        batch_key: out/albedo_pred
        mask_key: valid_mask
        folder_name: albedo_prediction
        file_path_key: rgb_path
    - VisualizeAlbedoComparison:
        rgb_key: rgb_norm
        pred_key: out/albedo_pred
        gt_key: albedo_gt
        mask_key: valid_mask
        folder_name: albedo_comparison
        file_path_key: rgb_path
        max_error: 1.0
